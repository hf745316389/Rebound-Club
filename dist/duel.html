<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1022">
<meta name="description" content="反弹守卫双人对战（本机测试版）：两人各守一门，有来有回。">
<title>反弹守卫 · 双人对战</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ed6843'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff5da' stroke-width='3'/%3E%3Cpath d='M15 32h34M32 15c-12 10-12 24 0 34m0-34c12 10 12 24 0 34' fill='none' stroke='%23fff5da' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./lobby.css">
<link rel="stylesheet" href="./duel.css">
</head>
<body data-screen="ready">
<div class="boot" id="boot" role="status" aria-live="polite"><span class="boot-ball" aria-hidden="true"></span><b>正在载入球场…</b><small id="boot-note">首次打开约需下载 2 MB</small></div>
<div class="app">
<header class="site-header">
  <a class="brand" href="./" aria-label="返回反弹守卫单机"><span class="brand-ball"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="13"/><path d="M7 20h26M20 7c-10 8-10 18 0 26m0-26c10 8 10 18 0 26"/></svg></span><span>反弹守卫<small>双人对战 · 测试版</small></span></a>
  <div class="header-right"><button class="icon-button sound-button" id="sound" aria-label="关闭音效" aria-pressed="true"><span class="sound-glyph">♪</span><span>音效开</span></button></div>
</header>
<main class="layout">
  <section class="game-shell" aria-label="双人对战">
    <div class="game-top"><div class="stage-heading"><span class="mini-label">双人对战</span><h2 id="stage-name">先进 5 球获胜</h2></div><span class="preview-label">本机测试 <span>↗</span></span><button id="pause" class="pause-button" aria-label="暂停对战" disabled><span></span><span></span></button></div>
    <div class="hud"><div class="hud-progress"><span class="hud-label" id="score-label">我 : 对手</span><b id="progress">0 : 0</b><div class="progress-track"><i id="progress-bar"></i></div></div><div class="hud-divider"></div><div class="lives"><span class="hud-label">对局</span><div id="hearts">先进 5 球</div></div></div>
    <div class="court-wrap" id="court-wrap">
      <canvas id="court" width="450" height="540" tabindex="0" aria-label="对战球场。左右方向键移动，空格挥击，Esc暂停。"></canvas>
      <div class="court-badge"><span class="live-dot"></span><span id="court-status">热身准备</span></div>
      <div class="result-pop" id="result-pop" aria-live="polite"></div>
      <div class="hit-pop" id="hit-pop" aria-live="polite"></div>
      <div class="split-hud" id="split-hud" hidden>
        <div class="split-side" id="side-a"><b class="split-tag">1P</b><div class="split-pop" id="pop-a" aria-live="polite"></div>
          <div class="split-panel"><span class="split-cue" id="cue-a">看准再出手</span><span class="split-energy"><i id="energy-a"></i></span>
            <span class="split-skills"><span id="spin-a">旋转 Q</span><span id="burst-a">爆发 E</span></span><small class="split-keys">A / D 移动 · 空格挥击</small></div></div>
        <div class="split-side" id="side-b"><b class="split-tag">2P</b><div class="split-pop" id="pop-b" aria-live="polite"></div>
          <div class="split-panel"><span class="split-cue" id="cue-b">看准再出手</span><span class="split-energy"><i id="energy-b"></i></span>
            <span class="split-skills"><span id="spin-b">旋转 ,</span><span id="burst-b">爆发 .</span></span><small class="split-keys">← / → 移动 · ↑ 挥击</small></div></div>
      </div>
      <div class="overlay" id="overlay" hidden><div class="overlay-content" id="overlay-content"></div></div>
    </div>
    <div class="controls"><div class="move-control" id="move-control" role="group" aria-label="左右移动" aria-describedby="move-hint"><div class="move-buttons"><button type="button" class="move-button" id="move-left" aria-label="向左移动" aria-pressed="false" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16H6m9-9-9 9 9 9"/></svg></button><button type="button" class="move-button" id="move-right" aria-label="向右移动" aria-pressed="false" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 16h20m-9-9 9 9-9 9"/></svg></button></div><small id="move-hint">按住移动 · 挥击时定方向</small></div><div class="attack-wrap"><span class="attack-hint" id="attack-hint">看准再出手</span><div class="skill-dock" id="skill-dock"><div class="energy" id="energy" role="meter" aria-label="能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i id="energy-fill"></i><b class="energy-tick" aria-hidden="true"></b><span id="energy-value">50</span></div><div class="skill-buttons"><button class="skill-button spin" id="skill-spin" aria-label="旋转回击，消耗50能量"><b>旋转<em id="spin-dir"></em></b><small id="spin-key">50 · J</small><span class="skill-state" id="spin-state">待开球</span></button><button class="skill-button burst" id="skill-burst" aria-label="爆发回击，消耗100能量"><b>爆发</b><small id="burst-key">100 · K</small><span class="skill-state" id="burst-state">待开球</span></button></div></div><button id="attack" class="attack-button" aria-label="挥击" disabled><svg viewBox="0 0 48 44" aria-hidden="true"><path d="M13 28c-8-2-9-12-4-15 2-1 5 0 7 3V9c0-4 6-4 6 0V6c0-4 6-4 6 0v2c0-4 6-4 6 0v3c1-4 7-3 7 1v10c0 6-5 10-11 10H17zM17 32v5h14v-5"/></svg><span>挥击</span><small id="attack-key">SPACE</small></button></div></div>
    <div class="game-footer"><span id="feedback">选好对手，就上场。</span><span id="score">对战 <small>测试版</small></span></div>
  </section>
  <aside class="sidebar prep-panel lobby-menu duel-menu" aria-label="对战设置">
    <div class="duel-group" role="radiogroup" aria-label="对手"><span class="duel-label">对手</span>
      <button type="button" class="duel-choice" data-mode="ai" role="radio" aria-checked="true">对战 AI</button>
      <button type="button" class="duel-choice" data-mode="local" role="radio" aria-checked="false" id="mode-local">本机双人 · 分屏</button></div>
    <div class="duel-group" role="radiogroup" aria-label="网络模拟" id="latency-group"><span class="duel-label">网络模拟</span>
      <button type="button" class="duel-choice" data-latency="0" role="radio" aria-checked="true">0</button>
      <button type="button" class="duel-choice" data-latency="80" role="radio" aria-checked="false">80</button>
      <button type="button" class="duel-choice" data-latency="150" role="radio" aria-checked="false">150</button>
      <button type="button" class="duel-choice" data-latency="250" role="radio" aria-checked="false">250 ms</button></div>
    <div class="duel-group fighter-group" role="radiogroup" aria-labelledby="pick-a-label" id="pick-a"><span class="duel-label" id="pick-a-label">我的角色</span></div>
    <p class="fighter-role" id="role-a"></p>
    <div class="duel-group fighter-group" role="radiogroup" aria-labelledby="pick-b-label" id="pick-b"><span class="duel-label" id="pick-b-label">对手角色</span></div>
    <p class="fighter-role" id="role-b"></p>
    <p class="duel-keys" id="duel-keys"></p>
    <button class="primary-button start-button" id="start-match" data-action="start">开始对战 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg></button>
    <a class="text-button duel-back" href="./index.html">返回单机</a>
  </aside>
</main>
</div>
<noscript>请开启 JavaScript 以进行对战。</noscript>
<script type="module" src="./duel.js"></script>
</body>
</html>
