<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1022">
<meta name="description" content="反弹守卫双人对战（本机测试版）：两人各守一门，有来有回。">
<title>反弹守卫 · 双人对战</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ed6843'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff5da' stroke-width='3'/%3E%3Cpath d='M15 32h34M32 15c-12 10-12 24 0 34m0-34c12 10 12 24 0 34' fill='none' stroke='%23fff5da' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./lobby.css">
<link rel="stylesheet" href="./duel.css">
</head>
<body data-screen="ready">
<div class="boot" id="boot" role="status" aria-live="polite"><span class="boot-ball" aria-hidden="true"></span><b>正在载入球场…</b><small id="boot-note">首次打开约需下载 2 MB</small></div>
<div class="app">
<header class="site-header">
  <a class="brand" href="./" aria-label="返回反弹守卫单机"><span class="brand-ball"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="13"/><path d="M7 20h26M20 7c-10 8-10 18 0 26m0-26c10 8 10 18 0 26"/></svg></span><span>反弹守卫<small>双人对战 · 测试版</small></span></a>
  <div class="header-right"><button class="icon-button sound-button" id="sound" aria-label="关闭音效" aria-pressed="true"><span class="sound-glyph">♪</span><span>音效开</span></button></div>
</header>
<main class="layout">
  <section class="game-shell" aria-label="双人对战">
    <div class="game-top"><div class="stage-heading"><span class="mini-label">双人对战</span><h2 id="stage-name">先进 5 球获胜</h2></div><span class="preview-label">本机测试 <span>↗</span></span><button id="pause" class="pause-button" aria-label="暂停对战" disabled><span></span><span></span></button></div>
    <div class="hud"><div class="hud-progress"><span class="hud-label" id="score-label">我 : 对手</span><b id="progress">0 : 0</b><div class="progress-track"><i id="progress-bar"></i></div></div><div class="hud-divider"></div><div class="lives"><span class="hud-label">对局</span><div id="hearts">先进 5 球</div></div></div>
    <div class="court-wrap" id="court-wrap">
      <canvas id="court" width="450" height="540" tabindex="0" aria-label="对战球场。左右方向键移动，空格挥击，Esc暂停。"></canvas>
      <div class="court-badge"><span class="live-dot"></span><span id="court-status">热身准备</span></div>
      <div class="result-pop" id="result-pop" aria-live="polite"></div>
      <div class="hit-pop" id="hit-pop" aria-live="polite"></div>
      <div class="combo" id="combo"><b id="combo-n">0</b><span>连击</span><em class="chain" id="chain"></em><small id="combo-mult">×1.0</small></div>
      <div class="foe-streak" id="foe-streak"></div>
      <div class="overlay" id="overlay" hidden><div class="overlay-content" id="overlay-content"></div></div>
    </div>
    <div class="controls"><div class="move-control" id="move-control" role="group" aria-label="左右移动" aria-describedby="move-hint"><div class="move-buttons"><button type="button" class="move-button" id="move-left" aria-label="向左移动" aria-pressed="false" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16H6m9-9-9 9 9 9"/></svg></button><button type="button" class="move-button" id="move-right" aria-label="向右移动" aria-pressed="false" disabled><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 16h20m-9-9 9 9-9 9"/></svg></button></div><small id="move-hint">按住移动 · 挥击时定方向</small></div><div class="attack-wrap"><span class="attack-hint" id="attack-hint">看准再出手</span><div class="skill-dock" id="skill-dock"><div class="energy" id="energy" role="meter" aria-label="能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i id="energy-fill"></i><b class="energy-tick" aria-hidden="true"></b><span id="energy-value">50</span></div><div class="skill-buttons"><button class="skill-button spin" id="skill-spin" aria-label="旋转回击，消耗50能量"><b>旋转<em id="spin-dir"></em></b><small id="spin-key">50 · J</small><span class="skill-state" id="spin-state">待开球</span></button><button class="skill-button burst" id="skill-burst" aria-label="爆发回击，消耗100能量"><b>爆发</b><small id="burst-key">100 · K</small><span class="skill-state" id="burst-state">待开球</span></button></div></div><button id="attack" class="attack-button" aria-label="挥击" disabled><svg viewBox="0 0 48 44" aria-hidden="true"><path d="M13 28c-8-2-9-12-4-15 2-1 5 0 7 3V9c0-4 6-4 6 0V6c0-4 6-4 6 0v2c0-4 6-4 6 0v3c1-4 7-3 7 1v10c0 6-5 10-11 10H17zM17 32v5h14v-5"/></svg><span>挥击</span><small id="attack-key">SPACE</small></button></div><div class="watch-bar" id="watch-bar" hidden><button type="button" class="watch-button" data-action="swap-view">换个方向看</button><button type="button" class="watch-button" data-action="setup">返回房间</button></div></div>
    <div class="game-footer"><span id="feedback">选好对手，就上场。</span><span id="score">对战 <small>测试版</small></span></div>
  </section>
  <aside class="sidebar prep-panel lobby-menu duel-menu" aria-label="对战设置">
    <div class="duel-group" role="radiogroup" aria-label="对手"><span class="duel-label">对手</span>
      <button type="button" class="duel-choice" data-mode="ai" role="radio" aria-checked="true">对战 AI</button>
      <button type="button" class="duel-choice" data-mode="online" role="radio" aria-checked="false">好友联机</button>
      <button type="button" class="duel-choice" data-mode="local" role="radio" aria-checked="false" id="mode-local">本机双人</button></div>
    <!-- data-bot: the AI's level (duel-bot.mjs BOT_LEVELS). -->
    <div class="duel-group" role="radiogroup" aria-label="AI 难度" id="bot-group"><span class="duel-label">AI 难度</span>
      <button type="button" class="duel-choice" data-bot="easy" role="radio" aria-checked="false">简单</button>
      <button type="button" class="duel-choice" data-bot="normal" role="radio" aria-checked="true">普通</button>
      <button type="button" class="duel-choice" data-bot="hard" role="radio" aria-checked="false">困难</button></div>
    <!-- Online play (duel-link.mjs): open a room, or join one by its code; an invite link (?room=<id>) joins at once. Up to
         8 in a room: two on the court, the rest queued or watching. -->
    <div class="duel-group" id="online-group" hidden><span class="duel-label">好友联机</span>
      <div class="online-lobby" id="online-lobby">
        <input class="online-name" id="online-name" maxlength="24" placeholder="你的名字（可不填）" autocomplete="nickname" spellcheck="false" aria-label="你的名字">
        <button type="button" class="duel-choice" data-action="host">创建房间</button>
        <input class="online-code" id="join-code" maxlength="7" placeholder="房间码" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="房间码">
        <button type="button" class="duel-choice" data-action="join">加入</button>
      </div>
      <div class="online-room" id="online-room" hidden>
        <div class="room-code"><small>房间码</small><b id="room-code">-----</b></div>
        <button type="button" class="duel-choice" data-action="invite">邀请好友</button>
        <button type="button" class="duel-choice" data-action="leave">离开房间</button>
      </div>
      <div class="room-panel" id="room-panel" hidden>
        <ul class="room-members" id="room-members" aria-label="房间成员"></ul>
        <div class="room-actions" id="room-actions"></div>
        <div class="room-rename"><input class="online-name" id="rename-input" maxlength="24" spellcheck="false" aria-label="新名字"><button type="button" class="duel-choice" data-action="rename">改名</button></div>
        <div class="duel-group" role="radiogroup" aria-label="一局打完谁下场" id="rotation-group" hidden><span class="duel-label">一局打完谁下场（房主选）</span>
          <button type="button" class="duel-choice" data-rotation="loser" role="radio" aria-checked="true">输的下</button>
          <button type="button" class="duel-choice" data-rotation="winner" role="radio" aria-checked="false">赢的下</button>
          <button type="button" class="duel-choice" data-rotation="both" role="radio" aria-checked="false">两个都下</button></div>
        <p class="room-rules" id="room-rules"></p>
      </div>
      <p class="online-status" id="online-status" aria-live="polite"></p>
    </div>
    <!-- data-latency is the one-way delay the loopback adds to every message; the label is the round trip (ping) players know. -->
    <div class="duel-group" role="radiogroup" aria-label="网络模拟，往返延迟（毫秒）" id="latency-group"><span class="duel-label">网络模拟 · 往返延迟（ping，毫秒）</span>
      <button type="button" class="duel-choice" data-latency="0" role="radio" aria-checked="true">0</button>
      <button type="button" class="duel-choice" data-latency="20" role="radio" aria-checked="false">40</button>
      <button type="button" class="duel-choice" data-latency="40" role="radio" aria-checked="false">80</button>
      <button type="button" class="duel-choice" data-latency="80" role="radio" aria-checked="false">160</button>
      <button type="button" class="duel-choice" data-latency="150" role="radio" aria-checked="false">300</button>
      <button type="button" class="duel-choice" data-latency="250" role="radio" aria-checked="false">500</button></div>
    <div class="duel-group" role="radiogroup" aria-label="同步方式" id="sync-group"><span class="duel-label">同步方式</span>
      <button type="button" class="duel-choice" data-sync="catchup" role="radio" aria-checked="true">追帧</button>
      <button type="button" class="duel-choice" data-sync="fullflight" role="radio" aria-checked="false">出球放慢</button>
      <button type="button" class="duel-choice" data-sync="blind" role="radio" aria-checked="false">盲测</button></div>
    <p class="duel-keys" id="duel-keys"></p>
    <button class="primary-button start-button" id="start-match" data-action="start">开始对战 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg></button>
    <a class="text-button duel-back" href="./index.html">返回单机</a>
  </aside>
</main>
</div>
<noscript>请开启 JavaScript 以进行对战。</noscript>
<script type="module" src="./duel.js"></script>
</body>
</html>
